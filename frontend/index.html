<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Audio unlock overlay (shown until user interacts) -->
  <div id="audio-unlock" class="audio-unlock">
    <div class="unlock-text">CLICK TO ENABLE AUDIO</div>
  </div>

  <!-- Main orb canvas -->
  <canvas id="orb-canvas"></canvas>

  <!-- Error display (top center) -->
  <div id="error-text" class="error-text"></div>

  <!-- Status text (bottom center, above label) -->
  <div id="status-text" class="status-text">INITIALIZING</div>

  <!-- JARVIS label -->
  <div id="jarvis-label" class="jarvis-label">JARVIS</div>

  <!-- Top-right controls -->
  <div class="controls" id="controls">
    <button class="ctrl-btn" id="btn-mic" title="Toggle microphone">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btn-mute" title="Mute output">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="btn-settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Text input bar (appears on click or Escape) -->
  <div class="input-bar" id="input-bar">
    <input type="text" id="text-input" placeholder="Type a message..." autocomplete="off" />
    <button id="btn-send">Send</button>
  </div>

  <!-- Settings panel (slide-in from right) -->
  <div id="settings-panel" class="settings-panel"></div>
  <div id="settings-overlay" class="settings-overlay"></div>

  <!-- Response text display -->
  <div id="response-text" class="response-text"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
